services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  data-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: data-pipeline:local
    profiles:
      - pipeline
    working_dir: /app
    env_file:
      - .env
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_CONSOLE: http://localhost:9001
      MINIO_LAKE_PREFIX: ${MINIO_LAKE_PREFIX:-lake}
      MINIO_SECURE: "false"
    volumes:
      - .:/app
    depends_on:
      minio:
        condition: service_healthy
    stdin_open: true
    tty: true
    command: ["python", "-m", "src.data_engineering.pipeline", "--help"]

volumes:
  minio_data:
